[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
publish = false

# DESIGN 18.5: the simulation has no need for unsafe, and forbidding it
# outright removes a class of determinism bug we would otherwise have to
# reason about.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Every dependency is declared here once, so versions stay aligned across
# crates. Later work packages add to this list rather than declaring
# versions in individual crate manifests.
[workspace.dependencies]
criterion = { version = "0.7", default-features = false }
clap = { version = "4", features = ["derive"] }
assert_cmd = "2"
predicates = "3"
serde = { version = "1", features = ["derive"] }
ron = "0.12"
insta = "1"
serde_json = "1"
blake3 = "1"
dirs = "6"
# The extractor only (T2.2.1, T2.4.1). Neither is used by anything shipped.
ureq = "3"
scraper = "0.27"
# The engine's PRNG, pinned exactly: results must not change under a
# dependency update without someone noticing (T3.7.1).
rand_chacha = "=0.10.0"
rand_core = "0.10"
rayon = "1"
smallvec = "1"
proptest = "1"

[profile.release]
# Keeps release profiles readable for profiling without the cost of full
# debug info. Fat LTO and one codegen unit were measured in WP4.11
# (docs/findings/T4.11.6-performance.md).
debug = "line-tables-only"
lto = "fat"
codegen-units = 1
