name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    # Windows is gwsim's only supported platform (DESIGN 18.2), so it is the
    # platform that has to be green. windows-latest is Windows Server 2025 and
    # ships MSVC and Rust 1.98.1 preinstalled (see docs/findings/T0.6.2-ci.md).
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # Rust is preinstalled on the runner, but pinning it explicitly keeps the
      # log honest and survives a future image dropping it. rust-toolchain.toml
      # also names stable, so there is no conflict.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Formatting first: it is the cheapest way to fail.
      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Checks data/ the way a contributor would, rather than through the
      # tests, so a data file that breaks the shipped tree fails CI even if
      # no test happens to read it (T1.2.12).
      - name: Validate data
        run: cargo run -p gwsim-cli -- data validate

      # Reduced relative checks (T4.10.6): SELF, DET, RC2 and RC6 must pass.
      # About a minute on a runner at the reduced run counts.
      - name: Relative checks
        run: cargo run --release -p gwsim-cli -- check --level reduced --only SELF --only DET --only RC2 --only RC6

      # RC1 fails on the current model (docs/findings/T4.10.7-m1-relative-checks.md)
      # and waits on the owner's decision (fallout F4.40), so it reports
      # without failing the build until then.
      - name: Relative check RC1 (reporting only)
        continue-on-error: true
        run: cargo run --release -p gwsim-cli -- check --level reduced --only RC1

      # Performance smoke test (T4.11.5): events per fight within 20% of the
      # recorded baseline, and a generous wall-clock budget in release.
      - name: Performance smoke test
        run: cargo test --release -p gwsim-engine --test perf_smoke
